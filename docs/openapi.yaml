openapi: 3.0.3
info:
  title: Paperless REST API
  description: |
    Document Management System REST API for the SWEN3 Paperless project.
    Provides endpoints for document archiving, file storage, asynchronous OCR processing,
    Google Gemini GenAI summarization, Elasticsearch full-text and fuzzy search,
    and metadata management (tags, correspondents, document types).
  version: 1.0.0
  contact:
    name: Philip Duong & Patrick Hornek
    email: contact@paperless.local
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://localhost:8080
    description: Local Docker / Development Server

tags:
  - name: Documents
    description: Core document uploading, lifecycle management, metadata, and file downloads.
  - name: Search
    description: Full-text and fuzzy search powered by Elasticsearch.
  - name: Tags
    description: Categorization labels for organizing documents.
  - name: Correspondents
    description: Senders and recipients of documents (e.g., companies, authorities, individuals).
  - name: Document Types
    description: Document classifications (e.g., Invoice, Contract, Receipt, Bank Statement).
  - name: Batch Processing
    description: Batch processing access logs from external systems (XML import).

paths:
  # ============================================================================
  # DOCUMENTS
  # ============================================================================
  /api/v1/documents:
    get:
      tags:
        - Documents
      summary: Search and list documents
      description: Returns a paginated list of archived documents with optional metadata filtering.
      operationId: searchDocuments
      parameters:
        - name: page
          in: query
          description: Zero-based page index.
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: The size of the page to be returned.
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          description: Sorting criteria in the format property,(asc|desc).
          required: false
          schema:
            type: string
            default: createdAt,desc
        - name: tagId
          in: query
          description: Filter by associated Tag ID.
          required: false
          schema:
            type: integer
            format: int64
        - name: correspondentId
          in: query
          description: Filter by Correspondent ID.
          required: false
          schema:
            type: integer
            format: int64
        - name: documentTypeId
          in: query
          description: Filter by Document Type ID.
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successfully retrieved paged documents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPageResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Documents
      summary: Upload a new document
      description: |
        Uploads a PDF document to file storage (MinIO).
        Triggers asynchronous message dispatch to RabbitMQ for OCR recognition and GenAI summarization.
      operationId: uploadDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - document
                - title
              properties:
                document:
                  type: string
                  format: binary
                  description: The binary PDF document file.
                title:
                  type: string
                  example: Electricity Invoice October 2026
                  maxLength: 255
                correspondentId:
                  type: integer
                  format: int64
                  nullable: true
                  example: 1
                documentTypeId:
                  type: integer
                  format: int64
                  nullable: true
                  example: 2
                tagIds:
                  type: array
                  items:
                    type: integer
                    format: int64
                  example: [1, 3]
      responses:
        '201':
          description: Document successfully uploaded and queued for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/documents/{id}:
    get:
      tags:
        - Documents
      summary: Get document details by ID
      description: Returns full document metadata, including OCR content, AI summary, and processing status.
      operationId: getDocumentById
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Document details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - Documents
      summary: Update document metadata
      description: Updates editable metadata fields of a document (title, correspondent, document type, tags).
      operationId: updateDocumentMetadata
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentRequest'
      responses:
        '200':
          description: Document updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Documents
      summary: Delete a document
      description: Deletes document record, file from MinIO, and Elasticsearch search index entry.
      operationId: deleteDocument
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '204':
          description: Document successfully deleted.
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/documents/{id}/download:
    get:
      tags:
        - Documents
      summary: Download original document file
      description: Streams the original uploaded PDF file from object storage (MinIO).
      operationId: downloadDocumentFile
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Binary PDF file content.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================================
  # SEARCH (ELASTICSEARCH)
  # ============================================================================
  /api/v1/search:
    get:
      tags:
        - Search
      summary: Full-text and fuzzy search across documents
      description: Performs full-text queries against OCR extracted text, titles, and summaries using Elasticsearch.
      operationId: searchDocumentsFullText
      parameters:
        - name: query
          in: query
          description: Text search query or keywords.
          required: true
          schema:
            type: string
            example: "invoice electric"
        - name: fuzzy
          in: query
          description: Enable fuzzy typo tolerance matching.
          required: false
          schema:
            type: boolean
            default: true
        - name: page
          in: query
          description: Zero-based page index.
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: Page size.
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Search results returned successfully with highlights and relevance scores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================================
  # TAGS
  # ============================================================================
  /api/v1/tags:
    get:
      tags:
        - Tags
      summary: List all tags
      operationId: searchTags
      responses:
        '200':
          description: List of all tags.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Tags
      summary: Create a new tag
      operationId: createTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '201':
          description: Tag created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/tags/{id}:
    get:
      tags:
        - Tags
      summary: Get tag by ID
      operationId: getTagById
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Tag retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Tags
      summary: Update a tag
      operationId: updateTag
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTagRequest'
      responses:
        '200':
          description: Tag updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Tags
      summary: Delete a tag
      operationId: deleteTag
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '204':
          description: Tag deleted successfully.
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================================
  # CORRESPONDENTS
  # ============================================================================
  /api/v1/correspondents:
    get:
      tags:
        - Correspondents
      summary: List all correspondents
      operationId: searchCorrespondents
      responses:
        '200':
          description: List of correspondents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CorrespondentResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Correspondents
      summary: Create a new correspondent
      operationId: createCorrespondent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCorrespondentRequest'
      responses:
        '201':
          description: Correspondent created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrespondentResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/correspondents/{id}:
    get:
      tags:
        - Correspondents
      summary: Get correspondent by ID
      operationId: getCorrespondentById
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Correspondent retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrespondentResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Correspondents
      summary: Update a correspondent
      operationId: updateCorrespondent
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCorrespondentRequest'
      responses:
        '200':
          description: Correspondent updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrespondentResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Correspondents
      summary: Delete a correspondent
      operationId: deleteCorrespondent
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '204':
          description: Correspondent deleted successfully.
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================================
  # DOCUMENT TYPES
  # ============================================================================
  /api/v1/document-types:
    get:
      tags:
        - Document Types
      summary: List all document types
      operationId: searchDocumentTypes
      responses:
        '200':
          description: List of document types.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentTypeResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Document Types
      summary: Create a new document type
      operationId: createDocumentType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentTypeRequest'
      responses:
        '201':
          description: Document type created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentTypeResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/document-types/{id}:
    get:
      tags:
        - Document Types
      summary: Get document type by ID
      operationId: getDocumentTypeById
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Document type retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentTypeResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Document Types
      summary: Update a document type
      operationId: updateDocumentType
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentTypeRequest'
      responses:
        '200':
          description: Document type updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentTypeResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Document Types
      summary: Delete a document type
      operationId: deleteDocumentType
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '204':
          description: Document type deleted successfully.
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================================
  # BATCH PROCESSING (SPRINT 6)
  # ============================================================================
  /api/v1/batch/access-logs:
    post:
      tags:
        - Batch Processing
      summary: Ingest external access logs (XML batch upload)
      description: Imports access log records in XML format and stores processing results in PostgreSQL.
      operationId: ingestAccessLogs
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: string
              example: |
                <?xml version="1.0" encoding="UTF-8"?>
                <accessLogs>
                  <logEntry>
                    <timestamp>2026-10-15T01:00:00Z</timestamp>
                    <sourceSystem>ExternalAccounting</sourceSystem>
                    <action>DOCUMENT_FETCH</action>
                    <documentId>1</documentId>
                  </logEntry>
                </accessLogs>
      responses:
        '200':
          description: Batch logs ingested and processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recordsProcessed:
                    type: integer
                    example: 42
                  status:
                    type: string
                    example: SUCCESS
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

# ==============================================================================
# COMPONENTS & SCHEMAS
# ==============================================================================
components:
  parameters:
    PathId:
      name: id
      in: path
      description: Unique identifier of the resource.
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    # --- Page Metadata Envelope ---
    PageMetadata:
      type: object
      required:
        - page
        - size
        - totalElements
        - totalPages
      properties:
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 10
        totalElements:
          type: integer
          format: int64
          example: 25
        totalPages:
          type: integer
          example: 3

    # --- Document Schemas ---
    ProcessingStatus:
      type: string
      enum:
        - PENDING
        - OCR_IN_PROGRESS
        - GENAI_IN_PROGRESS
        - COMPLETED
        - FAILED
      example: COMPLETED

    DocumentResponse:
      type: object
      required:
        - id
        - title
        - originalFilename
        - contentType
        - fileSize
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Electricity Invoice October 2026
        originalFilename:
          type: string
          example: invoice_oct_2026.pdf
        contentType:
          type: string
          example: application/pdf
        fileSize:
          type: integer
          format: int64
          description: Size in bytes.
          example: 245760
        status:
          $ref: '#/components/schemas/ProcessingStatus'
        ocrContent:
          type: string
          nullable: true
          description: Extracted text from OCR worker.
          example: "INVOICE #9821\nAmount Due: 142.50 EUR\nDate: 2026-10-01"
        summary:
          type: string
          nullable: true
          description: AI summary generated by Google Gemini worker.
          example: "Monthly utility invoice for electricity services totaling 142.50 EUR due by end of month."
        storageKey:
          type: string
          description: Object key in MinIO.
          example: "documents/2026/10/1_invoice_oct_2026.pdf"
        correspondent:
          $ref: '#/components/schemas/CorrespondentResponse'
          nullable: true
        documentType:
          $ref: '#/components/schemas/DocumentTypeResponse'
          nullable: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagResponse'
        createdAt:
          type: string
          format: date-time
          example: "2026-10-15T14:30:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-15T14:32:10Z"

    DocumentPageResponse:
      type: object
      required:
        - metaData
        - data
      properties:
        metaData:
          $ref: '#/components/schemas/PageMetadata'
        data:
          type: array
          items:
            $ref: '#/components/schemas/DocumentResponse'

    UpdateDocumentRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          example: "Updated Invoice Title"
        correspondentId:
          type: integer
          format: int64
          nullable: true
          example: 1
        documentTypeId:
          type: integer
          format: int64
          nullable: true
          example: 2
        tagIds:
          type: array
          items:
            type: integer
            format: int64
          example: [1, 2]

    # --- Search Result Schemas ---
    SearchResultItem:
      type: object
      required:
        - document
        - score
      properties:
        document:
          $ref: '#/components/schemas/DocumentResponse'
        score:
          type: number
          format: float
          description: Elasticsearch BM25 relevance score.
          example: 3.842
        highlights:
          type: array
          items:
            type: string
          description: Snippets matching search terms with <em> highlights.
          example:
            - "Electricity <em>Invoice</em> for October 2026"
            - "Total <em>amount</em> due: 142.50 EUR"

    SearchResponse:
      type: object
      required:
        - metaData
        - data
      properties:
        metaData:
          $ref: '#/components/schemas/PageMetadata'
        data:
          type: array
          items:
            $ref: '#/components/schemas/SearchResultItem'

    # --- Tag Schemas ---
    TagResponse:
      type: object
      required:
        - id
        - name
        - color
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Important
        color:
          type: string
          description: Hex color code.
          example: "#FF5733"

    CreateTagRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: Taxes
        color:
          type: string
          default: "#007BFF"
          example: "#28A745"

    UpdateTagRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: Taxes 2026
        color:
          type: string
          example: "#1E7E34"

    # --- Correspondent Schemas ---
    CorrespondentResponse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Wien Energie GmbH"
        notes:
          type: string
          nullable: true
          example: "Austrian energy provider"

    CreateCorrespondentRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: "A1 Telekom"
        notes:
          type: string
          nullable: true
          example: "Internet and mobile provider"

    UpdateCorrespondentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: "A1 Telekom Austria AG"
        notes:
          type: string
          nullable: true
          example: "Updated company profile"

    # --- Document Type Schemas ---
    DocumentTypeResponse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Invoice
        description:
          type: string
          nullable: true
          example: Billing and payment invoices

    CreateDocumentTypeRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Contract
        description:
          type: string
          nullable: true
          example: Employment, tenancy, and service contracts

    UpdateDocumentTypeRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Legal Contract
        description:
          type: string
          nullable: true
          example: Legal and financial binding contracts

    # --- Standard Error Envelope ---
    ErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-10-15T14:40:00Z"
        status:
          type: integer
          example: 404
        error:
          type: string
          example: Not Found
        message:
          type: string
          example: "Document with id 42 was not found."
        path:
          type: string
          example: "/api/v1/documents/42"
        validationErrors:
          type: array
          nullable: true
          items:
            type: object
            properties:
              field:
                type: string
                example: title
              rejectedValue:
                nullable: true
              message:
                type: string
                example: "Title must not be blank."

  # ============================================================================
  # RESPONSES
  # ============================================================================
  responses:
    BadRequestError:
      description: Bad Request - Validation failure or malformed body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFoundError:
      description: Not Found - The requested entity does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ConflictError:
      description: Conflict - A resource with the same identifier or unique constraint already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:

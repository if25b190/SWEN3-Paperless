services:
  backend:
    build:
      context: ./paperless-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    env_file:
      - .env.local
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/paperless}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-paperless}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-paperless_secure_password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-paperless_secure_password}
      DOCUMENT_STORAGE_TYPE: s3
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-paperless-documents}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-paperless}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-paperless_secure_password}

  ocr-worker:
    build:
      context: ./paperless-worker
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    mem_limit: 1g
    depends_on:
      rabbitmq:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-paperless_secure_password}
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-paperless-documents}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-paperless}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-paperless_secure_password}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng+deu}
      OCR_MAX_ATTEMPTS: ${OCR_MAX_ATTEMPTS:-3}
      OCR_RETRY_DELAY_MS: ${OCR_RETRY_DELAY_MS:-10000}
      OCR_PAGE_TIMEOUT: ${OCR_PAGE_TIMEOUT:-60}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-100}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-paperless-documents}
      WORKER_LOG_PATH: /var/log/paperless-worker/events.jsonl
    volumes:
      - worker-logs:/var/log/paperless-worker

  ui:
    build:
      context: ./paperless-ui
      dockerfile: Dockerfile
      args:
        BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${UI_PORT:-3000}:3000"
    env_file:
      - .env.local
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    env_file:
      - .env.local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paperless}
      POSTGRES_USER: ${POSTGRES_USER:-paperless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperless_secure_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paperless} -d ${POSTGRES_DB:-paperless}"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.4.0-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-paperless_secure_password}
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    restart: unless-stopped
    mem_limit: 1g
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  logstash:
    image: docker.elastic.co/logstash/logstash:9.5.5
    restart: unless-stopped
    mem_limit: 768m
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    depends_on:
      elasticsearch:
        condition: service_healthy
      ocr-worker:
        condition: service_started
    volumes:
      - ./infra/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./infra/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - worker-logs:/var/log/paperless-worker:ro
      - logstash-data:/usr/share/logstash/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600/_node/pipelines/main"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.5
    restart: unless-stopped
    mem_limit: 1g
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      SERVER_HOST: "0.0.0.0"
      TELEMETRY_ENABLED: "false"
      NODE_OPTIONS: "--max-old-space-size=768"
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    volumes:
      - kibana-data:/usr/share/kibana/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5601/api/status"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  rustfs:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-paperless}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-paperless_secure_password}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:${RUSTFS_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  rustfs-init:
    image: amazon/aws-cli:2.34.0
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-paperless}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-paperless_secure_password}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: ${S3_BUCKET:-paperless-documents}
      MIGRATE_LEGACY_DOCUMENTS: ${MIGRATE_LEGACY_DOCUMENTS:-false}
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./infra/rustfs/init.sh:/init.sh:ro
      - document-files:/legacy:ro

configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."

volumes:
  elasticsearch-data:
  logstash-data:
  kibana-data:
  worker-logs:
  rustfs-data:
  document-files:
  postgres-data:
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local

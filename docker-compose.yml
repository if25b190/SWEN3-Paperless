services:
  backend:
    build:
      context: ./paperless-backend
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    env_file:
      - .env.local
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/paperless}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-paperless}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-paperless_secure_password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-paperless_secure_password}
    volumes:
      - document-files:/tmp/paperless-documents

  worker:
    build:
      context: ./paperless-worker
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/paperless}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-paperless}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-paperless_secure_password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-paperless_secure_password}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      OCR_TESSERACT_LANGUAGES: ${OCR_TESSERACT_LANGUAGES:-eng}
      OCR_DPI: ${OCR_DPI:-300}
      OCR_PROCESS_TIMEOUT: ${OCR_PROCESS_TIMEOUT:-120s}
      OCR_FINAL_STATUS: ${OCR_FINAL_STATUS:-COMPLETED}
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTIC_USER: ${ELASTIC_USER:-elastic}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
      OCR_INDEX_NAME: ${OCR_INDEX_NAME:-paperless-documents}
    volumes:
      - document-files:/tmp/paperless-documents

  ui:
    build:
      context: ./paperless-ui
      dockerfile: Dockerfile
      network: host
      args:
        BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${UI_PORT:-3000}:3000"
    env_file:
      - .env.local
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5
    restart: unless-stopped
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9200/"]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    env_file:
      - .env.local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paperless}
      POSTGRES_USER: ${POSTGRES_USER:-paperless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperless_secure_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paperless} -d ${POSTGRES_DB:-paperless}"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.4.0-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-paperless_secure_password}
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."

volumes:
  document-files:
  elasticsearch-data:
  postgres-data:
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local

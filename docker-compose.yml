services:
  backend:
    build:
      context: ./paperless-backend
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    env_file:
      - .env.local
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/paperless}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-paperless}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-paperless_secure_password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-paperless_secure_password}
      # OpenTelemetry Java agent (baked into the image, see Dockerfile).
      JAVA_OPTS: -javaagent:/opt/otel/opentelemetry-javaagent.jar
      OTEL_SERVICE_NAME: paperless
      # The agent's OTLP exporter defaults to the HTTP/protobuf protocol when
      # an explicit endpoint is configured; the collector receives gRPC on
      # 4317, so pin the protocol.
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      # Only traces are consumed by the stack; metrics and logs stay disabled
      # (application logs are already collected by the Elastic Agent).
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      # OTLP gRPC endpoint of the OpenTelemetry collector.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    volumes:
      - document-files:/tmp/paperless-documents

  worker:
    build:
      context: ./paperless-worker
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/paperless}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-paperless}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-paperless_secure_password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-paperless_secure_password}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      OCR_TESSERACT_LANGUAGES: ${OCR_TESSERACT_LANGUAGES:-eng}
      OCR_DPI: ${OCR_DPI:-300}
      OCR_PROCESS_TIMEOUT: ${OCR_PROCESS_TIMEOUT:-120s}
      OCR_FINAL_STATUS: ${OCR_FINAL_STATUS:-COMPLETED}
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTIC_USER: ${ELASTIC_USER:-elastic}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
      OCR_INDEX_NAME: ${OCR_INDEX_NAME:-paperless-documents}
      WORKER_LOG_PATH: /var/log/paperless-worker/events.jsonl
      # OpenTelemetry Java agent (baked into the image, see Dockerfile).
      JAVA_OPTS: -javaagent:/opt/otel/opentelemetry-javaagent.jar
      OTEL_SERVICE_NAME: paperless-worker
      # The agent's OTLP exporter defaults to the HTTP/protobuf protocol when
      # an explicit endpoint is configured; the collector receives gRPC on
      # 4317, so pin the protocol.
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      # Only traces are consumed by the stack; metrics and logs stay disabled
      # (application logs are already collected by the Elastic Agent).
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      # OTLP gRPC endpoint of the OpenTelemetry collector.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    volumes:
      - worker-logs:/var/log/paperless-worker
      - document-files:/tmp/paperless-documents

  ui:
    build:
      context: ./paperless-ui
      dockerfile: Dockerfile
      network: host
      args:
        BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${UI_PORT:-3000}:3000"
    env_file:
      - .env.local
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    restart: unless-stopped
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9200/"]
      interval: 10s
      timeout: 5s
      retries: 10


  logstash:
    image: docker.elastic.co/logstash/logstash:9.5.5
    restart: unless-stopped
    mem_limit: 768m
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    depends_on:
      elasticsearch:
        condition: service_healthy
      worker:
        condition: service_started
    volumes:
      - ./infra/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./infra/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - worker-logs:/var/log/paperless-worker:ro
      - logstash-data:/usr/share/logstash/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600/_node/pipelines/main"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  elasticsearch-bootstrap:
    image: curlimages/curl:8.12.1
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./infra/elasticsearch/pipelines/paperless-container-logs.json:/pipeline.json:ro
      - ./infra/elasticsearch/pipelines/paperless-container-logs-template.json:/index-template.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Waiting for Elasticsearch..."
        until curl -sf http://elasticsearch:9200/ > /dev/null; do sleep 2; done
        echo "Loading ingest pipeline paperless-container-logs..."
        curl -sf -X PUT "http://elasticsearch:9200/_ingest/pipeline/paperless-container-logs" \
          -H "Content-Type: application/json" \
          --data-binary @/pipeline.json
        echo
        echo "Creating index template paperless-container-logs..."
        curl -sf -X PUT "http://elasticsearch:9200/_index_template/paperless-container-logs" \
          -H "Content-Type: application/json" \
          --data-binary @/index-template.json
        echo
        echo "Elasticsearch bootstrap complete."

  elastic-agent:
    image: docker.elastic.co/elastic-agent/elastic-agent:9.5.5
    restart: unless-stopped
    mem_limit: 512m
    # Root is required to read the host's container log files under
    # /var/lib/docker/containers (root-only on the host).
    user: root
    depends_on:
      elasticsearch-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ./infra/elastic-agent/elastic-agent.yml:/usr/share/elastic-agent/elastic-agent.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.5
    restart: unless-stopped
    mem_limit: 1g
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      SERVER_HOST: "0.0.0.0"
      TELEMETRY_ENABLED: "false"
      NODE_OPTIONS: "--max-old-space-size=768"
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    volumes:
      - kibana-data:/usr/share/kibana/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5601/api/status"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - tempo
    # 4317 is also published on localhost so natively run applications can
    # export traces to the same collector.
    ports:
      - "127.0.0.1:4317:4317"
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro

  tempo:
    image: grafana/tempo:2.8.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      # The tempo image has no /bin/sh, so the check must use the CMD form.
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  grafana:
    image: grafana/grafana:12.0.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-paperless}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    depends_on:
      tempo:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    env_file:
      - .env.local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paperless}
      POSTGRES_USER: ${POSTGRES_USER:-paperless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperless_secure_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paperless} -d ${POSTGRES_DB:-paperless}"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.4.0-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-paperless_secure_password}
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."

volumes:
  document-files:
  elasticsearch-data:
  logstash-data:
  kibana-data:
  tempo-data:
  grafana-data:
  worker-logs:
  postgres-data:
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local

openapi: 3.0.3
info:
  title: Paperless OCR Worker
  description: |
    Broker message contract of the `paperless.ocr.requests` queue.
    The backend publishes JSON `OcrRequest` messages on the `paperless.ocr`
    exchange (routing key `document.uploaded`) after a document upload;
    the worker consumes and processes them.
    The worker publishes OcrResult messages to routing key document.ocr.result.
    The backend applies results, maintains Elasticsearch, and consumes deletions.
    Every dispatch has an attemptId; results from obsolete attempts are ignored.
  version: 1.0.0
paths: {}
components:
  schemas:
    OcrRequestDTO:
      type: object
      required:
        - attemptId
        - jobId
        - documentId
        - storageKey
        - contentType
      properties:
        attemptId:
          type: string
          format: uuid
          description: Fencing token for this processing attempt.
        jobId:
          type: string
          format: uuid
          description: Unique OCR job identifier.
        documentId:
          type: string
          format: uuid
          description: Id of the document to process.
        storageKey:
          type: string
          description: Storage location of the uploaded file.
        contentType:
          type: string
          description: MIME type of the uploaded file.
    OcrResult:
      type: object
      required: [jobId, documentId, attemptId, status]
      properties:
        jobId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        attemptId:
          type: string
          format: uuid
        status:
          type: string
          enum: [STARTED, SUCCEEDED, FAILED]
        ocrContent:
          type: string
          nullable: true
          description: Required for SUCCEEDED, including an empty string when no text was found.

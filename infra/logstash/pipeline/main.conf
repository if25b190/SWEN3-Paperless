input {
  file {
    path => "/var/log/paperless-worker/events.jsonl"
    start_position => "beginning"
    # Persist the read position on the `logstash-data` volume so events are
    # not re-ingested after the container is recreated.
    sincedb_path => "/usr/share/logstash/data/sincedb"
    codec => json
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "paperless-worker-events"
  }
}

input {
  file {
    path => "/var/log/paperless-worker/events.jsonl"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/worker.sincedb"
    codec => json
  }
}

filter {
  date {
    match => ["timestamp", "ISO8601"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "paperless-worker-logs-%{+YYYY.MM.dd}"
    document_id => "%{[event_id]}"
    data_stream => false
    ilm_enabled => false
  }
}

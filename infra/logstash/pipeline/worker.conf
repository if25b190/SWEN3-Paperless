input {
  file {
    id => "worker_logs"
    path => ["/var/log/paperless-worker/worker.json", "/var/log/paperless-worker/worker.json.*"]
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/worker.sincedb"
    sincedb_write_interval => "1 second"
    codec => plain { ecs_compatibility => disabled }
  }
}

filter {
  fingerprint {
    source => "message"
    target => "[@metadata][event_id]"
    method => "SHA256"
  }
  json {
    source => "message"
    ecs_compatibility => disabled
  }
  mutate {
    rename => {
      "trace_id" => "[trace][id]"
      "span_id" => "[span][id]"
      "[trace.id]" => "[trace][id]"
      "[span.id]" => "[span][id]"
    }
  }
}

output {
  elasticsearch {
    id => "worker_logs_elasticsearch"
    hosts => ["http://elasticsearch:9200"]
    index => "paperless-worker-logs-%{+yyyy.MM.dd}"
    document_id => "%{[@metadata][event_id]}"
    data_stream => false
    ilm_enabled => false
    manage_template => false
  }
}

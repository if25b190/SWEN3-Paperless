# Tempo: trace store for the Paperless stack.
#
# Receives OTLP traces from the OpenTelemetry collector (gRPC on 4317, see
# infra/otel-collector/config.yaml) and serves the Grafana Tempo data source
# over its HTTP API on 3200 (published on localhost as well). Traces are kept
# in local storage on the `tempo-data` volume; the compactor prunes blocks
# after the retention configured under `overrides.defaults.compaction`.
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

live_store:
  max_trace_idle: 10s
  max_block_duration: 50s
  wal:
    path: /var/tempo/wal

overrides:
  defaults:
    compaction:
      block_retention: 72h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces

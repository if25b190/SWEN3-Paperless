# OpenTelemetry Collector for the Paperless stack.
#
# Receives OTLP traces from the backend and the worker (both export OTLP gRPC
# to port 4317, see OTEL_EXPORTER_OTLP_ENDPOINT) and indexes them into
# Elasticsearch as the paperless-traces index, viewable in Kibana.
# Port 4317 is published on localhost as well, so natively run applications
# can export traces to the same collector.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  elasticsearch:
    # Security is disabled in this local Compose setup, so the internal HTTP
    # endpoint is used without credentials.
    endpoints: [http://elasticsearch:9200]
    traces:
      index: paperless-traces

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [elasticsearch]

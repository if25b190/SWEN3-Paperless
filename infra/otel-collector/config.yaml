# OpenTelemetry Collector for the Paperless stack.
#
# Receives OTLP traces from the backend and the worker (both export OTLP gRPC
# to port 4317, see OTEL_EXPORTER_OTLP_ENDPOINT) and forwards them to Tempo.
# Port 4317 is published on localhost as well, so natively run applications
# can export traces to the same collector.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp_grpc/tempo:
    # Tempo 2.x exposes the OTLP gRPC receiver on 4317 (see tempo.yaml).
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/tempo]

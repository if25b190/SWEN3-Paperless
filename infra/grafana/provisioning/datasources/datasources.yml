apiVersion: 1

datasources:
  - name: Container logs
    uid: elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    jsonData:
      index: paperless-container-logs
      timeField: "@timestamp"
      logMessageField: message
      logLevelField: log.level
      dataLinks:
        - field: trace.id
          datasourceUid: tempo
          url: '$${__value.raw}'
          urlDisplayLabel: View trace

  - name: Worker logs
    uid: elasticsearch-worker
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    jsonData:
      index: paperless-worker-logs-*
      timeField: "@timestamp"
      logMessageField: message
      logLevelField: log.level
      dataLinks:
        - field: trace.id
          datasourceUid: tempo
          url: '$${__value.raw}'
          urlDisplayLabel: View trace

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      limit: 25
      tracesToLogsV2:
        datasourceUid: elasticsearch
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: 'trace.id:"$${__span.traceId}"'

spring:
  application:
    name: paperless
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:paperless}
    password: ${RABBITMQ_PASS:paperless_secure_password}
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1s
          max-interval: 5s
          multiplier: 2
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:50MB}
      max-request-size: ${MAX_UPLOAD_SIZE:50MB}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/paperless}
    username: ${SPRING_DATASOURCE_USERNAME:paperless}
    password: ${SPRING_DATASOURCE_PASSWORD:paperless}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration/postgresql
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

paperless:
  ocr:
    exchange: paperless.ocr
    queue: paperless.ocr.requests
    routing-key: document.uploaded
    dead-letter-exchange: paperless.ocr.dead-letter
    dead-letter-queue: paperless.ocr.failed
    confirm-timeout: 5s
    dispatch-enabled: ${OCR_DISPATCH_ENABLED:true}
    dispatch-delay: ${OCR_DISPATCH_DELAY:1000}
    worker-enabled: ${OCR_WORKER_ENABLED:false}

server:
  tomcat:
    # Drain near-limit rejected requests so clients can receive the HTTP 413 response.
    max-swallow-size: 51MB

logging:
  level:
    at.fhtw.swen3.paperless: ${PAPERLESS_LOG_LEVEL:INFO}
  pattern:
    level: "%5p [requestId=%X{requestId:-none}]"

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

elasticsearch:
  host: ${ELASTICSEARCH_HOST:localhost}
  port: ${ELASTICSEARCH_PORT:9200}
  username: ${ELASTIC_USER:elastic}
  password: ${ELASTIC_PASSWORD:paperless}

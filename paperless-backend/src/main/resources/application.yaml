spring:
  application:
    name: paperless
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:50MB}
      max-request-size: ${MAX_UPLOAD_SIZE:50MB}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/paperless}
    username: ${SPRING_DATASOURCE_USERNAME:paperless}
    password: ${SPRING_DATASOURCE_PASSWORD:paperless}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration/postgresql
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  tomcat:
    # Drain near-limit rejected requests so clients can receive the HTTP 413 response.
    max-swallow-size: 51MB

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

elasticsearch:
  host: ${ELASTICSEARCH_HOST:localhost}
  port: ${ELASTICSEARCH_PORT:9200}
  username: ${ELASTIC_USER:elastic}
  password: ${ELASTIC_PASSWORD:paperless}

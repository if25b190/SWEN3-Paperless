name: Backend CI

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - 'paperless-backend/**'
      - '.github/workflows/backend-ci.yml'
      - 'docs/openapi.yaml'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'paperless-backend/**'
      - '.github/workflows/backend-ci.yml'
      - 'docs/openapi.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build-test:
    name: Backend Build & Test (Java 25)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: paperless-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ensure Maven wrapper is executable
        run: chmod +x ./mvnw

      - name: Generate OpenAPI models & compile
        run: ./mvnw clean compile -B

      - name: Run tests
        run: ./mvnw test -B

      - name: Package JAR
        run: ./mvnw package -DskipTests -B

      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: paperless-backend/target/surefire-reports/
          retention-days: 7

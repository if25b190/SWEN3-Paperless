name: Worker CI

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - 'paperless-worker/**'
      - '.github/workflows/worker-ci.yml'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'paperless-worker/**'
      - '.github/workflows/worker-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-build-test:
    name: Worker Build & Test (Gradle / Java 25)
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:4.4.0-alpine
        env:
          RABBITMQ_DEFAULT_USER: paperless
          RABBITMQ_DEFAULT_PASS: worker_test_password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: paperless-worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Compile
        run: ./gradlew compileKotlin --no-daemon

      - name: Check formatting
        run: ./gradlew spotlessCheck --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon
        env:
          PAPERLESS_RABBITMQ_TEST: 'true'
          RABBITMQ_HOST: localhost
          RABBITMQ_USER: paperless
          RABBITMQ_PASS: worker_test_password

      - name: Package JAR
        run: ./gradlew bootJar -x test --no-daemon

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-gradle-test-reports
          path: paperless-worker/build/reports/tests/test/
          retention-days: 7

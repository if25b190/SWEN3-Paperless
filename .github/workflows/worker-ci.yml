name: Worker CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'paperless-worker/**'
      - 'docker-compose.yml'
      - '.github/workflows/worker-ci.yml'
  push:
    branches: [main, develop]
    paths:
      - 'paperless-worker/**'
      - 'docker-compose.yml'
      - '.github/workflows/worker-ci.yml'
  workflow_dispatch:

jobs:
  worker-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paperless-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: paperless-worker/requirements.txt
      - name: Install OCR engines and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-deu poppler-utils fonts-dejavu-core
          pip install -r requirements.txt
      - name: Run worker tests including real image and PDF OCR
        run: python -m unittest discover -s tests -v
      - name: Build worker image
        run: docker build -t paperless-worker:test .
